<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Send your list or menu choices to the shop on WhatsApp. The shop confirms your request and price."><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f5f5f4"><link rel="icon" href="%BASE_URL%mise-mark.svg" type="image/svg+xml"><title>Order from your shop — Mise</title></head><body><div id="shop-root"><p id="public-opening">Opening the shop…</p><main id="public-error" class="public-error card" hidden><h1>This shop link could not be opened</h1><p id="public-error-detail"></p></main>
<div class="public-shop" id="public-shop" hidden>
  <header class="public-brand"><span id="public-monogram" class="public-monogram" aria-hidden="true"></span><div class="public-brand-copy"><h1 id="public-name"></h1><p id="public-summary"></p></div><div class="public-language" aria-label="Page language"><button class="button button-ghost" type="button" data-action="language" data-value="en" aria-label="English">EN</button><button class="button button-ghost" type="button" data-action="language" data-value="bn" aria-label="বাংলা">বাং</button></div></header>
  <main><form id="shop-order" class="public-order-layout" novalidate>
    <nav class="public-categories" id="public-categories" aria-label="Menu categories" hidden></nav>
    <div class="public-customer-content">
      <p class="public-greeting" id="public-greeting" hidden></p>
      <section class="public-menu" id="public-menu" hidden><div class="public-search"><span data-icon="search"></span><input id="public-search" type="search" data-placeholder="search" data-label="search"></div><div id="public-menu-grid" class="public-menu-grid"></div></section>
      <section class="card public-entry"><div class="public-field public-list-field"><label for="public-list" id="public-list-label" data-copy="need"></label><textarea id="public-list" maxlength="4000" rows="3" placeholder="2 Napa Extra&#10;1 kg sugar&#10;1 Fresh milk 1 L"></textarea></div><div class="public-entry-tools"><button type="button" class="button button-ghost" data-action="voice" id="public-voice" data-label="voice" aria-pressed="false"><span data-icon="mic"></span></button><button type="button" class="button button-ghost" data-action="photo" data-label="photo"><span data-icon="camera"></span></button></div><p class="public-caption" id="public-entry-help" data-copy="write"></p></section>
      <div class="public-shortcuts"><button type="button" class="button button-secondary card public-shortcut" data-action="photo"><span data-icon="camera"></span><span data-copy="photo"></span><small data-copy="photoHelp"></small></button><button type="button" class="button button-secondary card public-shortcut" data-action="last" id="public-last"><span data-icon="refresh"></span><span data-copy="last"></span><small id="public-last-hint"></small></button></div>
      <div id="public-photo" class="card public-photo-row" hidden></div><input id="public-photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <section class="public-suggestions" id="public-suggestions" hidden><h2 data-copy="often">Often bought here</h2><div class="public-quick-items" id="public-quick-items"></div></section>
      <section class="public-fulfilment-section" id="public-fulfilment"><div class="public-fulfilment" role="group" aria-label="Fulfilment"><button type="button" class="button button-ghost" data-action="fulfilment" data-value="pickup" data-copy="pickup"></button><button type="button" class="button button-ghost" data-action="fulfilment" data-value="delivery" data-copy="delivery"></button></div><div class="public-address" id="public-address-row"><span data-icon="pin"></span><div class="public-field"><label for="public-address" data-copy="address"></label><input id="public-address" data-placeholder="address" type="text" maxlength="250" autocomplete="street-address"></div></div><div class="public-time-select"><span data-icon="clock"></span><select id="public-time-select" data-label="when"><option value="0" data-copy="now"></option><option value="1" data-copy="hour"></option><option value="2" data-copy="tomorrow"></option><option value="3" data-copy="other"></option></select></div><p class="public-caption public-shop-note" id="public-delivery-note" hidden></p><div class="public-times" role="group" aria-label="Requested time"><button type="button" class="button button-secondary" data-action="time" data-value="0" data-copy="now"></button><button type="button" class="button button-secondary" data-action="time" data-value="1" data-copy="hour"></button><button type="button" class="button button-secondary" data-action="time" data-value="2" data-copy="tomorrow"></button><button type="button" class="button button-secondary" data-action="time" data-value="3" data-copy="other"></button></div><input id="public-custom-time" type="text" maxlength="120" data-placeholder="when" data-label="when" hidden></section>
    </div>
    <aside class="card public-cart"><h2 data-copy="request">Your request</h2><div class="public-cart-items" id="public-cart-items" hidden></div><div class="public-subtotal" id="public-subtotal" hidden><span data-copy="subtotal"></span><strong id="public-total"></strong></div><p class="public-caption public-final-price" data-copy="price"></p>
      <section class="public-details"><h2 data-copy="details">Your details</h2><div class="public-field"><label for="public-customer-name" data-copy="name"></label><input id="public-customer-name" type="text" maxlength="80" autocomplete="name" required></div><div class="public-field"><label for="public-customer-phone" data-copy="phone"></label><div class="public-phone-input"><span data-icon="phone"></span><input id="public-customer-phone" type="tel" maxlength="40" autocomplete="tel" required></div></div><p class="public-caption" data-copy="saved"></p><button type="button" class="button button-ghost" data-action="forget" data-copy="forget"></button></section>
      <section class="public-payments"><h2 data-copy="preference">Payment preference</h2><div role="group" aria-label="Payment preference" id="public-payments"></div><p class="public-caption" data-copy="confirm"></p></section>
      <footer class="public-request-actions"><p class="public-error-message" id="public-error-message" role="alert" hidden></p><a id="public-send" href="#shop-order" target="_blank" rel="noopener noreferrer" class="button button-primary public-send" data-action="send"><span id="public-send-icon"></span><span data-copy="send"></span></a><div class="public-handoff-actions"><button type="button" class="button button-secondary" data-action="copy" data-copy="copy"></button><button type="button" class="button button-secondary" id="public-sent" data-action="sent" data-copy="sent" disabled></button></div><p class="public-caption" data-copy="noCharge"></p><p class="public-status" id="public-status" role="status"></p><details class="public-message-review" id="public-review" hidden><summary data-copy="review"></summary><div class="public-field"><label for="public-message" data-copy="message"></label><textarea id="public-message" readonly rows="7"></textarea></div><a id="public-retry" class="button button-secondary" target="_blank" rel="noopener noreferrer" data-copy="again"></a><button class="button button-ghost" type="button" data-action="select" data-copy="manual"></button></details></footer>
    </aside>
  </form></main><footer class="public-site-footer"><span id="public-contact"></span><a id="public-powered">Powered by Mise</a><span class="public-offline" id="public-offline" role="status"></span></footer>
</div></div><noscript>Enable JavaScript to read the shop details in this link.</noscript><script type="module" src="/src/public-shop/main.ts"></script></body></html>
