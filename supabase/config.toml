#:schema https://supabase.com/schemas/config/v1.json
# Local development only. Hosted provider credentials never belong in this file.
project_id = "mise"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173/app/"
additional_redirect_urls = []
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enabled = false

[auth.sms]
enabled = true
enable_confirmations = true
max_frequency = "60s"
template = "Your Mise code is {{ .Code }}"

# Reserved fictional number; local only. Never push test_otp to a hosted project.
[auth.sms.test_otp]
14155550100 = "123456"

[auth.rate_limit]
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

# This endpoint authenticates an enrolled device secret plus a staff PIN itself.
# The reserve/finish database protocol is service-only; it never trusts user claims.
[functions.device-pin]
verify_jwt = false

# Owner JWT is verified at the platform and forwarded to scoped database RPCs.
[functions.staff-pin]
verify_jwt = true

# Own authentication: enrolled device secret plus short staff session.
[functions.device-orders]
verify_jwt = false

# Device secret plus current staff session, rechecked inside the final write.
[functions.kitchen-actions]
verify_jwt = false

[functions.kitchen-tickets]
verify_jwt = false

[functions.kitchen-live]
verify_jwt = false

[functions.kitchen-recovery]
verify_jwt = false

# Dedicated server scheduler credential, verified by the handler; never a user
# session, device token, project key or query-string credential.
[functions.kitchen-alarms]
verify_jwt = false

# Own authentication: screen-owned secret, confirmed pairing and live PIN session.
# Short pairing codes can request approval; they cannot enroll a screen alone.
[functions.device-access]
verify_jwt = false

[functions.inbox-image]
verify_jwt = true

[functions.commands]
verify_jwt = true

[functions.sync-read]
verify_jwt = true

# Dedicated internal scheduler credential; no browser/device-selected messages.
[functions.kitchen-push]
verify_jwt = false

[functions.desk-notifications]
verify_jwt = true
