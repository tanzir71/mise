# Hosted configuration only. Never push the local development config/test OTP.
project_id = "mise-production"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]
auto_expose_new_tables = false

[auth]
site_url = "https://tanzir71.github.io/mise/app/"
additional_redirect_urls = []
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enabled = false

# Keep phone sign-in unavailable until the production SMS provider is configured.
[auth.sms]
enabled = false
enable_confirmations = true

[auth.rate_limit]
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
